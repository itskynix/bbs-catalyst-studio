dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modCompileOnly "maven.modrinth:sodium:mc1.20.1-0.5.8"
	modCompileOnly "maven.modrinth:iris:1.7.0+1.20.1"

	if (project.hasProperty('devMods')) {
		modLocalRuntime "maven.modrinth:sodium:mc1.20.1-0.5.8"
		modLocalRuntime "maven.modrinth:iris:1.7.0+1.20.1"
	}
	modCompileOnly "maven.modrinth:distanthorizons:2.4.5-b-1.20.1"
	modCompileOnly "maven.modrinth:indium:1.0.34+mc1.20.1"
}
