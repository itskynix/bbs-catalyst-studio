plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version.endsWith("-" + minecraft_version) ? project.mod_version : project.mod_version + "-" + minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven {
		name = "Gegy"
		url = "https://maven.gegy.dev/"
	}
	mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"bbs" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath.set(getRootProject().file("src/main/resources/bbs.accesswidener"))
}

/* Windows Java can fail to connect its selector's Unix-domain socket in the user temp
 * directory (PipeImpl: Invalid argument: connect). Keep these short-lived sockets local
 * to the development checkout; this also covers the integrated server started by the client. */
tasks.named('runClient', JavaExec) {
	if (System.getProperty('os.name').startsWith('Windows')) {
		def socketDir = layout.projectDirectory.dir('.gradle/sockets').asFile
		systemProperty 'jdk.net.unixdomain.tmpdir', socketDir.absolutePath
		doFirst {
			socketDir.mkdirs()
		}
	}
}

// Apply version-specific build script (1.20.1 / 1.20.4 / 1.21.1)
apply from: rootProject.file("versions/${project.name}/build.gradle")

/* The stage this jar is built as: -Pstage=TESTER|DEVELOPMENT|PRIVATE|UNDERRATING|PUBLIC, PUBLIC without it.
 * It ends up in assets/bbs/build_info.json, which the game reads when no local bbs/dev_state.json says otherwise. */
def buildStage = (project.findProperty("stage") ?: "PUBLIC").toString().trim().toUpperCase()

if (!["TESTER", "DEVELOPMENT", "PRIVATE", "UNDERRATING", "PUBLIC"].contains(buildStage)) {
	throw new GradleException("Unknown -Pstage='" + buildStage + "', use TESTER, DEVELOPMENT, PRIVATE, UNDERRATING or PUBLIC")
}


dependencies {
	modImplementation "org.anarres:jcpp:1.4.14"
	modImplementation "io.github.douira:glsl-transformer:2.0.0-pre13"

	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"
}

def fabricModVersion = project.findProperty('mod_semver') ?: project.version

def buildInfoDir = layout.buildDirectory.dir("generated/build_info")
def generateBuildInfo = tasks.register("generateBuildInfo") {
	def outDir = buildInfoDir
	def infoVersion = fabricModVersion.toString()

	def mcVersion = project.minecraft_version.toString()
	def gitRoot = rootProject.projectDir

	inputs.property("stage", buildStage)
	inputs.property("infoVersion", infoVersion)
	inputs.property("mcVersion", mcVersion)
	outputs.dir(outDir)

	/* The commit count and hash move with every commit and the date with every day, none of which are inputs Gradle
	 * could see: so the task always runs, and processResources only reruns when what it wrote actually changed. */
	outputs.upToDateWhen { false }

	doLast {
		def git = { String... args ->
			try
			{
				def process = (["git"] + args.toList()).execute(null, gitRoot)
				def text = process.text.trim()

				process.waitFor()

				return process.exitValue() == 0 && !text.isEmpty() ? text : null
			}
			catch (Throwable ignored)
			{
				return null
			}
		}

		def commit = git("rev-parse", "--short", "HEAD") ?: "nogit"
		def count = git("rev-list", "--count", "HEAD") ?: "0"
		def date = new Date().format("yyyyMMdd")
		def file = outDir.get().file("assets/bbs/build_info.json").asFile

		file.parentFile.mkdirs()
		file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			stage       : buildStage,
			version     : infoVersion,
			mod_version : project.mod_version.toString(),
			mc_version  : mcVersion,
			build_number: date + "." + count,
			commit      : commit
		])) + System.lineSeparator()
	}
}

processResources {
	inputs.property "version", fabricModVersion
	dependsOn generateBuildInfo
	from(buildInfoDir)

	filesMatching("fabric.mod.json") {
		expand "version": fabricModVersion, "minecraft_dependency": project.minecraft_dependency, "java_dependency": project.java_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = (project.findProperty('java_version') ?: '17').toInteger()
}

// src/test holds manual sanity mains (no JUnit); they are compiled, not discovered as tests.
test {
	failOnNoDiscoveredTests = false
}

tasks.register('migrationTest', JavaExec) {
	group = 'verification'
	description = 'Checks legacy body-part and film references without starting Minecraft.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mchorse.bbs_mod.data.migration.StableIdsMigrationTest'
}

tasks.register('anchorInterpolationTest', JavaExec) {
	group = 'verification'
	description = 'Checks anchor keyframes and resolved transitions without starting Minecraft.'
	dependsOn tasks.named('testClasses'), tasks.named('clientClasses')
	classpath = sourceSets.test.runtimeClasspath + sourceSets.client.runtimeClasspath
	mainClass = 'mchorse.bbs_mod.utils.keyframes.AnchorInterpolationTest'
	args 'client'
}

tasks.named('check') {
	dependsOn tasks.named('migrationTest'), tasks.named('anchorInterpolationTest')
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.findProperty('java_version') ?: '17')
	targetCompatibility = JavaVersion.toVersion(project.findProperty('java_version') ?: '17')
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			/* The project's name has a space in it, and Maven coordinates can't, so the
			 * artifact id is taken from the archives name instead of the default. */
			artifactId = project.base.archivesName.get()

			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

/* Addon API snapshot.
 *
 * The API's promise is only as good as the ability to notice it being broken, and nothing about a
 * Java signature says "an addon depends on this". So the whole public surface of
 * mchorse.bbs_mod.api is dumped into api/bbs-api.txt, which lives in the repository: a change to
 * it shows up in the diff of the commit that made it, and an accidental one is caught by apiCheck
 * before it ever reaches an addon. See ADDONS.md. */
def apiSnapshotFile = rootProject.file("api/bbs-api.txt")

def collectApiSignatures = {
	def dirs = []

	dirs.addAll(sourceSets.main.output.classesDirs.files)
	dirs.addAll(sourceSets.client.output.classesDirs.files)

	/* javap rather than a bytecode library: it comes with the JDK that is already running the
	 * build, and Gradle 9 took Project.exec away, so this is plain ProcessBuilder. */
	def javap = new File(new File(System.getProperty("java.home"), "bin"), "javap")
	def entries = [:]

	dirs.findAll { it.exists() }.each { dir ->
		def root = new File(dir, "mchorse/bbs_mod/api")

		if (!root.exists()) {
			return
		}

		def names = []

		root.eachFileRecurse { file ->
			if (file.name.endsWith(".class")) {
				names << dir.toPath().relativize(file.toPath()).toString()
					.replace(File.separator, "/")
					.replaceAll(/\.class$/, "")
					.replace("/", ".")
			}
		}

		if (names.isEmpty()) {
			return
		}

		def process = new ProcessBuilder([javap.absolutePath, "-protected", "-classpath", dir.absolutePath] + names.sort())
			.redirectErrorStream(true)
			.start()
		def output = process.inputStream.getText("UTF-8")

		if (process.waitFor() != 0) {
			throw new GradleException("javap failed while reading the addon API:\n" + output)
		}

		def header = null
		def members = null

		output.eachLine { line ->
			def trimmed = line.trim()

			if (trimmed.isEmpty() || trimmed.startsWith("Compiled from")) {
				return
			}

			if (trimmed == "}") {
				if (header != null) {
					entries.put(header, members.sort())
				}

				header = null
				members = null
			}
			else if (header == null) {
				header = trimmed
				members = []
			}
			else {
				members << trimmed
			}
		}
	}

	def builder = new StringBuilder()

	entries.keySet().sort().each { key ->
		builder.append(key).append("\n")
		entries.get(key).each { member -> builder.append("    ").append(member).append("\n") }
		builder.append("}\n\n")
	}

	return builder.toString()
}

tasks.register("apiDump") {
	group = "verification"
	description = "Writes the signatures of the addon API into api/bbs-api.txt."

	dependsOn tasks.named("classes"), tasks.named("clientClasses")

	doLast {
		apiSnapshotFile.parentFile.mkdirs()
		apiSnapshotFile.setText(collectApiSignatures(), "UTF-8")

		logger.lifecycle("Addon API snapshot written to ${apiSnapshotFile}")
	}
}

tasks.register("apiCheck") {
	group = "verification"
	description = "Fails when the addon API drifts from the snapshot in api/bbs-api.txt."

	dependsOn tasks.named("classes"), tasks.named("clientClasses")

	doLast {
		def current = collectApiSignatures()

		if (!apiSnapshotFile.exists()) {
			throw new GradleException("There is no addon API snapshot at ${apiSnapshotFile}. Run `gradlew apiDump` and commit it.")
		}

		def stored = apiSnapshotFile.getText("UTF-8").replace("\r\n", "\n")

		if (stored != current) {
			throw new GradleException("The addon API no longer matches api/bbs-api.txt. If the change is intended, run `gradlew apiDump` and commit the snapshot along with it; if it is not, this is an addon-breaking change that slipped in.")
		}
	}
}

tasks.named("build") {
	dependsOn tasks.named("apiCheck")
}

// Public addon contracts spanning common data and client evaluation, without a game window.
sourceSets {
    addonApiChecks {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
tasks.register('addonApiCheckJar', Jar) {
    dependsOn addonApiChecksClasses
    from sourceSets.addonApiChecks.output
    archiveFileName = 'addon-api-check.jar'
    destinationDirectory = layout.buildDirectory
}
loom {
    runs {
        addonApiCheck {
            client()
            runDir 'build/addonApiCheck'
            vmArg "-Dfabric.addMods=${layout.buildDirectory.file('addon-api-check.jar').get().asFile.absolutePath}"
        }
    }
}
tasks.named('runAddonApiCheck') { dependsOn 'addonApiCheckJar' }
tasks.register('addonApiCheck') {
    group = 'verification'
    description = 'Checks addon data/editor/pose contracts under Fabric, exiting before a game window opens.'
    dependsOn 'runAddonApiCheck'
}
tasks.named('check') { dependsOn 'addonApiCheck' }


/* A version can leave mixins out of the configs (excluded_mixins in its gradle.properties, the
 * names as they are written in the config): the classes may target something that is gone there. */
def excludedMixins = (project.findProperty('excluded_mixins') ?: '').toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

if (!excludedMixins.isEmpty()) {
	tasks.matching { it.name == 'processResources' || it.name == 'processClientResources' }.configureEach {
		filesMatching('*.mixins.json') {
			filter { String line -> excludedMixins.any { line.contains('"' + it + '"') } ? null : line }
		}
	}
}


/* The remapped jar lands in versions/<mc version>/build/libs under the name of its stage: bbs-cs-C1.4-1.20.4.jar for
 * PUBLIC, the stage appended for every other one (bbs-cs-C1.4-1.20.4-TESTER.jar). */
if (buildStage != "PUBLIC") {
	tasks.named("remapJar") { archiveClassifier = buildStage }
}
